<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/png" href="/parsnip.png" />
    <title>DeepSeek Harness · 星露谷物语</title>
    <style>
/* ============================================================
   DeepSeek Harness — 星露谷物语主题 Web UI
   设计铁律：像素渲染 / 木质面板 / 奶油纸面 / 深棕描边
   ============================================================ */
:root {
  --border: #4a2408;        /* 深棕描边 */
  --frame: #8a4b1f;         /* 木框 */
  --frame-hi: #b56a2c;      /* 木框高光 */
  --panel: #eec788;         /* 面板主色（暖棕） */
  --panel-light: #fbe4b0;   /* 奶油纸面 */
  --panel-dark: #d9a75f;    /* 面板暗部 */
  --ink: #452a0c;           /* 正文深棕 */
  --ink-soft: #7a5228;      /* 次要文字 */
  --barn-red: #a8331c;      /* 谷仓红（标题/强调） */
  --grass: #3d8c40;         /* 草绿 */
  --grass-dark: #2a6b2d;
  --gold: #ffd544;
  --sky: #4a86c5;
  --energy: #3ac81e;        /* 能量绿 */
  --term: #7ee65a;
  --cave: #1a1008;          /* 洞穴黑（终端） */
  --cave-mid: #2a1a0e;
}
@font-face {
  font-family: 'FusionPixel';
  src: url('/fusion-pixel-12px.woff2') format('woff2');
  font-weight: normal;
  font-style: normal;
  font-display: block;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body {
  font-family: 'FusionPixel', 'Microsoft YaHei', sans-serif;
  background-color: #6db3f2;
  background-image: url('/valley.jpg');
  background-size: cover;
  background-position: center;
  background-attachment: fixed;
  background-repeat: no-repeat;
  image-rendering: pixelated;
  color: var(--ink);
  font-size: 14px;
  overflow: hidden;
  user-select: none;
}
::selection { background: var(--barn-red); color: #fff; }
::-webkit-scrollbar { width: 12px; height: 12px; }
::-webkit-scrollbar-track { background: var(--panel-dark); }
::-webkit-scrollbar-thumb { background: var(--frame); border: 2px solid var(--border); }
:focus-visible { outline: 2px solid var(--grass); outline-offset: 1px; }

/* ---------- 通用像素面板 / 按钮 ---------- */
.pixel-panel {
  background: var(--panel);
  border: 3px solid var(--border);
  box-shadow: inset 2px 2px var(--panel-light), inset -2px -2px var(--panel-dark);
}
.pixel-btn {
  background: var(--frame-hi);
  border: 2px solid var(--border);
  box-shadow: inset 1px 1px #d98f4a, inset -1px -1px #6b3a12;
  color: #fff3d8;
  font-family: inherit;
  font-size: 14px;
  padding: 6px 14px;
  cursor: pointer;
  text-shadow: 1px 1px 0 var(--border);
}
.pixel-btn:hover { filter: brightness(1.12); color: #fff; }
.pixel-btn:active { box-shadow: inset -1px -1px #d98f4a, inset 1px 1px #6b3a12; }
.pixel-btn.btn-sm { font-size: 12px; padding: 3px 10px; }
.pixel-btn.btn-gold { background: #d9a02a; box-shadow: inset 1px 1px #f5cf6a, inset -1px -1px #8a5f10; }
.pixel-btn.btn-danger { background: var(--barn-red); box-shadow: inset 1px 1px #d45a3a, inset -1px -1px #5f1a0c; }
.pixel-btn:disabled { opacity: 0.5; cursor: not-allowed; filter: none; }
.pixel-input {
  background: var(--panel-light);
  border: 2px solid var(--border);
  box-shadow: inset 1px 1px var(--panel-dark);
  color: var(--ink);
  font-family: inherit;
  font-size: 14px;
  padding: 6px 8px;
  outline: none;
}
.pixel-input::placeholder { color: var(--ink-soft); }
.pixel-input:focus { box-shadow: inset 1px 1px var(--panel-dark), 0 0 0 2px var(--grass); }

/* ---------- 屏幕切换 ---------- */
.screen { position: fixed; inset: 0; display: flex; flex-direction: column; }
.screen[hidden] { display: none; }

/* ---------- 标题屏 ---------- */
#screen-title { align-items: center; justify-content: center; gap: 26px; }
.title-logo-img {
  width: 480px;
  max-width: 80vw;
  image-rendering: pixelated;
  filter: drop-shadow(4px 4px 0 rgba(74, 36, 8, 0.55));
}
.title-sub {
  font-size: 16px;
  color: #fff8e0;
  text-shadow: 2px 2px 0 var(--border);
  letter-spacing: 2px;
}
.title-menu { display: flex; flex-direction: column; gap: 10px; margin-top: 8px; }
.menu-item {
  width: 320px;
  background: var(--frame-hi);
  border: 3px solid var(--border);
  box-shadow: inset 2px 2px #d98f4a, inset -2px -2px #6b3a12;
  color: #fff3d8;
  font-family: inherit;
  font-size: 20px;
  padding: 10px 0;
  text-align: center;
  cursor: pointer;
  letter-spacing: 4px;
  text-shadow: 2px 2px 0 var(--border);
}
.menu-item:hover, .menu-item.kb-hover { color: var(--gold); filter: brightness(1.15); }
.title-foot { font-size: 12px; color: #fff8e0; text-shadow: 1px 1px 0 var(--border); }
.conn-dot { display: inline-block; width: 10px; height: 10px; border: 1px solid var(--border); background: #888; margin-right: 6px; vertical-align: middle; }
.conn-dot.on { background: var(--energy); }
.conn-dot.off { background: var(--barn-red); }

/* ---------- 主屏 ---------- */
#screen-main { padding: 10px; gap: 10px; }
.main-top {
  flex: none;
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 8px 12px;
}
.main-title { font-size: 18px; color: var(--barn-red); text-shadow: 1px 1px 0 var(--panel-light); letter-spacing: 2px; }
.mode-badge {
  font-size: 12px;
  padding: 2px 10px;
  border: 2px solid var(--border);
  background: var(--panel-light);
  color: var(--grass-dark);
}
.top-spacer { flex: 1; }
.main-body { flex: 1; min-height: 0; display: flex; gap: 10px; }
.chat-col { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 10px; }
.messages {
  flex: 1;
  min-height: 0;
  overflow-y: auto;
  padding: 14px;
  display: flex;
  flex-direction: column;
  gap: 14px;
}

/* 消息 */
.msg { display: flex; flex-direction: column; }
.msg.user { align-self: flex-end; max-width: 86%; }
.msg.user .msg-bubble {
  background: var(--panel-dark);
  border: 3px solid var(--border);
  box-shadow: inset 2px 2px var(--panel), inset -2px -2px var(--frame-hi);
  padding: 10px 14px;
  min-width: 0;
}
.msg.user .msg-name { font-size: 12px; font-weight: bold; color: var(--barn-red); margin-bottom: 6px; }
.msg.user .msg-text { white-space: pre-wrap; word-break: break-word; line-height: 1.7; font-size: 20px; color: var(--ink); }

.msg.bot { align-self: flex-start; max-width: 94%; }
.msg.bot .msg-bubble {
  background: var(--panel-light);
  border: 4px solid var(--frame);
  box-shadow: inset 0 0 0 2px var(--panel);
  padding: 10px 14px 10px 38px;
  min-width: 0;
  position: relative;
}
.msg.bot .msg-bubble::before {
  content: '';
  position: absolute;
  top: 6px; left: 8px;
  width: 20px; height: 20px;
  background: url('/heart.png') center / contain no-repeat;
  image-rendering: pixelated;
}
.msg.bot .msg-name { font-size: 12px; font-weight: bold; color: var(--grass-dark); margin-bottom: 6px; }
/* 消息/思考/工具输出文本可选中复制（body 全局 user-select:none 的例外区） */
.msg-text, .tool-sec pre, .msg-reasoning .r-body { user-select: text; }
.msg-name { display: flex; align-items: center; gap: 8px; }
/* 消息复制按钮：随名牌行右置，悬停金色高亮 */
.msg-copy {
  margin-left: auto; font-family: inherit; font-size: 11px; padding: 1px 8px; cursor: pointer;
  background: rgba(74,36,8,0.12); color: var(--ink-soft); border: 1px solid rgba(74,36,8,0.35);
}
.msg-copy:hover { color: var(--barn-red); border-color: var(--barn-red); }
.msg.bot .msg-text { white-space: pre-wrap; word-break: break-word; line-height: 1.55; font-size: 20px; color: var(--ink); }
/* markdown 正文接管排版：关闭 pre-wrap，间距交给 .md 内元素 */
.msg.bot .msg-text.md { white-space: normal; }
.msg-reasoning {
  margin-bottom: 8px;
  border: 2px solid var(--frame);
  background: var(--panel);
  padding: 4px 8px;
}
.msg-reasoning summary { font-size: 12px; color: var(--ink-soft); cursor: pointer; user-select: none; }
.msg-reasoning summary.live { color: var(--grass-dark); font-weight: bold; }
.msg-reasoning .r-body { font-size: 13px; color: var(--ink-soft); white-space: pre-wrap; word-break: break-word; line-height: 1.5; margin-top: 4px; max-height: 200px; overflow-y: auto; }
.msg-usage { margin-top: 6px; font-size: 11px; color: var(--ink-soft); text-align: right; }
.sys-line { align-self: center; font-size: 12px; color: var(--grass-dark); background: rgba(251,228,176,0.85); border: 1px solid var(--frame); padding: 2px 8px; text-align: center; }
.sys-line.err { color: var(--barn-red); }
.thinking-row { align-self: flex-start; display: flex; gap: 6px; padding: 10px 14px; }
.thinking-row .tdot { width: 8px; height: 8px; background: var(--frame-hi); border: 1px solid var(--border); animation: tblink 0.9s step-end infinite; }
.thinking-row .tdot:nth-child(2) { animation-delay: 0.3s; }
.thinking-row .tdot:nth-child(3) { animation-delay: 0.6s; }
@keyframes tblink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0.15; } }

/* ---------- Markdown 渲染（祝尼魔消息正文，农场手账风） ---------- */
.md > :first-child { margin-top: 0; }
.md > :last-child { margin-bottom: 0; }
.md p { margin: 8px 0; line-height: 1.7; }
.md h1, .md h2, .md h3, .md h4, .md h5, .md h6 { margin: 14px 0 8px; line-height: 1.4; color: var(--grass-dark); }
.md h1 { font-size: 24px; border-bottom: 3px solid var(--frame); padding-bottom: 4px; }
.md h2 { font-size: 22px; border-bottom: 2px solid var(--frame-hi); padding-bottom: 3px; }
.md h3 { font-size: 20px; color: var(--barn-red); }
.md h4 { font-size: 19px; }
.md h5, .md h6 { font-size: 18px; color: var(--ink-soft); }
.md ul, .md ol { margin: 8px 0; padding-left: 26px; }
.md li { margin: 3px 0; line-height: 1.6; }
.md li::marker { color: var(--frame-hi); }
.md li > ul, .md li > ol { margin: 3px 0; }
.md blockquote { margin: 8px 0; padding: 6px 12px; border-left: 5px solid var(--frame-hi); background: rgba(217,167,95,0.35); color: var(--ink-soft); }
.md blockquote p { margin: 4px 0; }
.md hr { border: none; border-top: 3px dashed var(--frame-hi); margin: 12px 0; }
.md a { color: var(--grass-dark); text-decoration: underline; text-underline-offset: 3px; word-break: break-all; }
.md a:hover { color: var(--barn-red); }
.md code { font-family: Consolas, 'Courier New', monospace; font-size: 0.76em; background: var(--cave-mid); color: #e3b878; padding: 2px 6px; border: 1px solid var(--border); border-radius: 2px; word-break: break-word; }
.md table { border-collapse: collapse; margin: 10px 0; font-size: 17px; max-width: 100%; display: block; overflow-x: auto; }
.md th, .md td { border: 2px solid var(--frame); padding: 4px 10px; }
.md th { background: var(--panel-dark); color: var(--ink); }
.md tbody tr:nth-child(even) td { background: rgba(238,199,136,0.5); }
/* 代码块：深褐木匣 + 语言牌 + 复制按钮 */
.md .codebox { margin: 10px 0; border: 2px solid var(--border); box-shadow: inset 1px 1px #4a3016, inset -1px -1px #000; background: var(--cave-mid); }
.md .codebox-head { display: flex; align-items: center; padding: 3px 8px; background: #4a3016; color: #d9b072; font-family: Consolas, monospace; font-size: 11px; user-select: none; }
.md .codebox-copy { margin-left: auto; font-family: inherit; font-size: 11px; padding: 0 8px; cursor: pointer; background: rgba(0,0,0,0.25); color: #d9b072; border: 1px solid #6a4a28; }
.md .codebox-copy:hover { color: var(--gold); border-color: var(--gold); }
.md .codebox pre { margin: 0; padding: 10px 12px; overflow-x: auto; }
.md .codebox code { background: none; border: none; padding: 0; color: var(--term); font-size: 14px; line-height: 1.55; display: block; white-space: pre; }
.md .tok-str { color: #a8d08d; }
.md .tok-com { color: #8a6238; font-style: italic; }
.md .tok-kw { color: #7ec8e3; }
.md .tok-num { color: #e8a0b4; }
.md .tok-tag { color: #e8c06a; }

/* 工具块：木匣双节（参数 / 输出），布告栏委托风 */
.tool-block {
  align-self: flex-start;
  width: 94%;
  background: var(--cave-mid);
  border: 2px solid var(--border);
  box-shadow: inset 1px 1px #4a3016, inset -1px -1px #000;
  font-family: Consolas, 'Courier New', monospace;
  font-size: 12px;
}
.tool-head { padding: 6px 10px; color: #e8c06a; cursor: pointer; display: flex; gap: 8px; align-items: center; user-select: none; }
.tool-head:hover { color: var(--gold); }
.tool-head .tool-label { font-weight: bold; flex: none; }
.tool-head .tool-raw { color: #9a7a4a; font-size: 10px; flex: none; }
.tool-head .tool-args { color: #7a9a5a; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; min-width: 0; }
.tool-head .tool-mark { flex: none; }
.tool-copy {
  flex: none; margin-left: auto; font-family: inherit; font-size: 10px; padding: 0 6px; cursor: pointer;
  background: rgba(0,0,0,0.25); color: #d9b072; border: 1px solid #6a4a28;
}
.tool-copy:hover { color: var(--gold); border-color: var(--gold); }
.tool-body { padding: 0; }
.tool-sec { border-top: 1px solid #4a3016; }
.tool-sec-label { padding: 3px 10px 2px; color: #9a7a4a; font-size: 10px; letter-spacing: 2px; user-select: none; }
.tool-sec pre { margin: 0; padding: 2px 12px 8px; white-space: pre-wrap; word-break: break-word; color: var(--term); max-height: 240px; overflow-y: auto; font-size: 12px; }
.tool-sec.args pre { color: #c8b088; }
.tool-block.collapsed .tool-sec { display: none; }
.tool-error .tool-head { color: #ff8a6a; }
.tool-error .tool-sec.result pre { color: #ff9a8a; }
.tool-running .tool-mark::after { content: '…'; color: var(--gold); }
/* 结果区 JSON 着色 */
.j-key { color: #e8c06a; }
.j-str { color: #a8d08d; }
.j-num { color: #7ec8e3; }
.j-bool { color: #e8a0b4; }

/* ---------- 祝尼魔对话框输入区 ---------- */
.input-area {
  flex: none;
  display: flex;
  position: relative;
  background: var(--panel-light);
  border: 4px solid var(--frame);
  box-shadow: inset 0 0 0 2px var(--panel);
  image-rendering: pixelated;
}
.dlg-heart {
  position: absolute;
  top: 6px; left: 8px;
  width: 20px; height: 20px;
  background: url('/heart.png') center / contain no-repeat;
  image-rendering: pixelated;
  z-index: 1;
}
.dlg-npc {
  width: 118px;
  flex: none;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 14px 0 8px;
  border-right: 3px solid var(--frame);
  background: var(--panel);
}
.dlg-avatar-frame {
  width: 88px; height: 88px;
  border: 3px solid var(--frame);
  background: var(--panel-light);
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
}
.dlg-avatar-frame img { image-rendering: pixelated; }
/* 自定义头像（照片）：铺满裁切、平滑渲染；默认像素画保持 pixelated */
.dlg-avatar-frame img.custom { image-rendering: auto; width: 100%; height: 100%; object-fit: cover; }
/* 农场伙伴弹窗预览行 */
.pet-preview { display: flex; align-items: center; gap: 14px; margin: 4px 0 12px; }
.pet-preview .dlg-avatar-frame { flex: none; }
.pet-name-input { margin-top: 8px; }
/* 性格文本域（复用 pixel-input 视觉）与 .md 导入进度条 */
.persona-textarea { width: 100%; min-height: 96px; resize: vertical; line-height: 1.6; }
.md-progress { display: flex; align-items: center; gap: 8px; margin: 6px 0; }
.md-progress-track { flex: 1; height: 12px; border: 2px solid var(--border); background: var(--panel-dark); overflow: hidden; }
.md-progress-bar { height: 100%; width: 0%; background: var(--grass); transition: width 0.15s ease-out; }
.md-progress-text { font-size: 12px; color: var(--ink-soft); flex: none; }
/* 桌宠层：每只桌宠一个整屏透明 iframe（脚本按 PETS 清单生成）；显示/隐藏走 opacity+visibility 过渡（visibility 离散翻转，隐藏时仍渐隐完） */
.pet-layer {
  position: fixed; inset: 0; z-index: 90; pointer-events: none;
  opacity: 0; visibility: hidden;
  transition: opacity 0.5s ease, visibility 0.5s;
}
.pet-layer.pet-on { opacity: 1; visibility: visible; }
.pet-layer iframe { width: 100%; height: 100%; border: 0; display: block; }
/* 桌宠 toggle 开关：像素滑轨 + 滑块，开启时轨道变绿 */
.pet-row { display: flex; align-items: center; gap: 10px; margin: 6px 0 2px; }
.pet-toggle { cursor: pointer; flex: none; }
.pet-toggle-track {
  width: 54px; height: 26px; position: relative;
  border: 2px solid var(--border); background: var(--panel-dark);
  box-shadow: inset 1px 1px var(--frame);
  transition: background 0.2s ease;
}
.pet-toggle-knob {
  position: absolute; left: 2px; top: 2px; width: 18px; height: 18px;
  background: var(--panel-light); border: 2px solid var(--border);
  transition: left 0.2s ease, background 0.2s ease;
}
.pet-toggle.on .pet-toggle-track { background: var(--grass); }
.pet-toggle.on .pet-toggle-knob { left: 28px; background: #fff8dc; }
.pet-toggle:hover .pet-toggle-knob { filter: brightness(1.1); }
.pet-state { color: var(--ink-soft); font-size: 12px; }
.dlg-npc-name {
  margin-top: 8px;
  color: var(--grass-dark);
  font-size: 16px;
  font-weight: bold;
  text-shadow: 1px 1px 0 var(--panel-light);
  letter-spacing: 1px;
}
.dlg-main { flex: 1; min-width: 0; display: flex; flex-direction: column; padding: 12px 22px 8px; }
.dlg-input {
  flex: 1;
  min-height: 56px;
  background: transparent;
  border: none;
  outline: none;
  resize: none;
  font-family: inherit;
  font-size: 20px;
  line-height: 1.5;
  color: var(--ink);
}
.dlg-input::placeholder { color: var(--ink-soft); }
.dlg-btnrow { display: flex; align-items: baseline; gap: 18px; flex-wrap: wrap; margin-top: 6px; }
.dlg-btnrow.dlg-last { margin-top: auto; padding-top: 6px; }
.dlg-btn {
  background: transparent;
  border: none;
  font-family: inherit;
  font-size: 20px;
  color: var(--frame);
  cursor: pointer;
  padding: 2px 4px;
  letter-spacing: 2px;
}
.dlg-btn:hover { color: var(--barn-red); text-decoration: underline; }
.dlg-btn.dlg-send { color: var(--grass-dark); font-weight: bold; }
.dlg-btn.dlg-stop { color: var(--barn-red); }

/* ---------- 右侧 HUD ---------- */
.hud-col { width: 230px; flex: none; display: flex; flex-direction: column; gap: 10px; }
.hud-panel { padding: 10px 12px; }
.hud-title { font-size: 12px; color: var(--barn-red); margin-bottom: 8px; letter-spacing: 2px; }
.mode-name { font-size: 15px; color: var(--grass-dark); word-break: break-all; }
.mode-desc { font-size: 12px; color: var(--ink-soft); margin-top: 6px; line-height: 1.5; }
.todo-list { list-style: none; font-size: 13px; }
.todo-list li { display: flex; gap: 8px; align-items: flex-start; padding: 3px 0; line-height: 1.5; color: var(--ink); }
.todo-list .px-checkbox {
  width: 12px; height: 12px; flex: none;
  border: 2px solid var(--border);
  background: var(--panel-light);
  box-shadow: inset 1px 1px var(--panel-dark);
  margin-top: 3px;
}
.todo-list li.done { color: var(--ink-soft); text-decoration: line-through; }
.todo-list li.done .px-checkbox { background: var(--grass); }
.todo-list li.doing { color: var(--barn-red); }
.todo-list li.doing .px-checkbox { background: var(--gold); }
.todo-empty { color: var(--ink-soft); font-size: 12px; }
.hud-tip { font-size: 12px; color: var(--ink-soft); line-height: 1.6; }
.hud-key { margin-top: 8px; font-size: 12px; color: var(--ink); }
.hud-key .k-dot { display: inline-block; width: 8px; height: 8px; border: 1px solid var(--border); margin-right: 4px; vertical-align: middle; }
.hud-key .k-dot.ok { background: var(--energy); }
.hud-key .k-dot.no { background: var(--barn-red); }

/* 上下文能量条：仿游戏能量条（棕色外框 + E 盖帽 + 绿色竖条） */
.hud-energy { display: flex; gap: 12px; align-items: flex-end; margin-top: 10px; }
.energy-bar {

<!-- 桌宠层由脚本按 PETS 清单动态生成（每只桌宠一个透明 iframe，独立开关）；层级低于弹窗 -->
<div id="modal-root" hidden></div>

<script>
/* ============================================================
   星露谷 UI 原生客户端：直接对话 dsh web 的 /api Typert 网关
   （0.1.2-rc.1 ~ 0.1.7-rc.2 实测兼容）
   一元调用 POST /api/<namespace>/<method>，payload 为 {args:{...}}；
   事件流 WebSocket /api/remote.mux（open/item/end/error 多路复用帧），
   广播与需应答事件走 $events 流，会话日志走 session/follow 流。
   ============================================================ */
'use strict'
const $ = (sel) => document.querySelector(sel)
const TZ = Intl.DateTimeFormat().resolvedOptions().timeZone || 'Asia/Shanghai'
const KEY_REF = 'DEEPSEEK_API_KEY'
const PRESET_NAMES = { standard: '标准农场', code: '河边农场', minimal: '森林农场', cordis: '山顶农场' }
/** 模式选择弹窗的四个难度档：id 对应 agent preset，cls 控制按钮配色，desc 为右侧说明。 */
const MODE_META = [
  { id: 'standard', cls: 'travel', desc: '耕地最多的经典地形——功能完整的编码 Agent：编辑、Shell、检索、技能、计划、子代理。' },
  { id: 'code', cls: 'soft', desc: '水道纵横，适合钓鱼佬——标准全部能力，并用 Code Mode SDK 以一个程序组合多步操作。' },
  { id: 'minimal', cls: 'medium', desc: '浆果与木桩随手可采——仅持久 bash 与编辑器双工具的极简 Agent。' },
  { id: 'cordis', cls: 'hard', desc: '矿点丰富但开垦费劲——用于创建自定义 preset：标准全部能力 + 运行时检查与实验。' },
]

/* 星露谷历法：一年四季、每季 28 天、每周 7 天。每创建一个新存档（新会话）
   就推进一天；换季时全屏横幅 + 音效，日期与偏好存 localStorage。

const SEASONS = [
  { id: 'spring', name: '春', word: '春天来了', tint: 'rgba(126, 188, 88, 0.13)', hue: '#5da646' },

  { id: 'winter', name: '冬', word: '冬天来了', tint: 'rgba(127, 159, 201, 0.15)', hue: '#7f9fc9' },
]
const WEEKDAYS = ['周一', '周二', '周三', '周四', '周五', '周六', '周日']
/** 每日运势：游戏 TV 占卜的口吻；按 (年,季,日) 确定性抽取，同一天内人人一致。 */
const FORTUNES = {
  good: [
    '星之果实今天格外饱满——冒险与收割都会顺利。',
    '祝尼魔们在暗中帮你搬东西，今天做事事半功倍。',

    '风从南边来，不急不躁——适合整理仓库和回信。',
    '今天海水的味道一般，钓鱼佬宜守不宜进。',
    '普普通通的一天，但普普通通也是种运气。',
  ],
  bad: [
    '乌鸦在田里开会……今天不宜冒险，留意脚下。',
    '石头今天特别硬，敲矿请三思。',
    '云层压得很低，精灵们都在打盹——重要的事改天再做。',
    '今天的运气像漏水的屋顶，出门记得带伞。',
  ],
}
const LUCKY_COLORS = ['谷仓红', '草绿', '金黄', '海蓝', '奶油白', '南瓜橙', '莓果紫']

state.weather = localStorage.getItem('stardew.weather') !== '0'   // 天气粒子
state.seasonTint = localStorage.getItem('stardew.seasonTint') !== '0' // 季节色调

function loadCalendar() {
  try {
    const c = JSON.parse(localStorage.getItem('stardew.calendar'))
    if (c && Number.isInteger(c.year) && Number.isInteger(c.day) && c.season >= 0 && c.season < 4) return c
  } catch { /* 损坏即重置 */ }
  return { year: 1, season: 0, day: 1 }
}
state.cal = loadCalendar()
function saveCalendar() { localStorage.setItem('stardew.calendar', JSON.stringify(state.cal)) }
function seasonOf() { return SEASONS[state.cal.season] }
/** 星露谷星期：1 日固定为周一。 */
function weekdayOf(day) { return WEEKDAYS[(day - 1) % 7] }
function calDateLabel() { return '第' + state.cal.year + '年 ' + seasonOf().name + state.cal.day + '日' }
/**
 * 推进一天（新存档 = 星露谷的新一天）。
 * @returns {{seasonChanged: boolean, yearRolled: boolean}} 供调用方播报换季/新年。
 */
function advanceDay() {
  const prevSeason = state.cal.season
  state.cal.day += 1
  let seasonChanged = false, yearRolled = false
  if (state.cal.day > 28) {
    state.cal.day = 1
    state.cal.season = (state.cal.season + 1) % 4
    seasonChanged = true
    if (state.cal.season === 0) { state.cal.year += 1; yearRolled = true }
  }
  saveCalendar()
  applySeasonLook()
  if (seasonChanged) seasonFanfare(seasonOf(), yearRolled)
  return { seasonChanged, yearRolled }
}
/** 今日运势：运气三档 + 幸运色 + 幸运数字，由 (年,季,日) 哈希决定。 */
function dailyFortune() {
  const h = (state.cal.year * 4096 + state.cal.season * 28 + state.cal.day) * 2654435761 >>> 0
  const luck = h % 100
  const pool = luck < 40 ? FORTUNES.good : luck < 82 ? FORTUNES.normal : FORTUNES.bad
  const text = pool[(h >>> 8) % pool.length]
  const color = LUCKY_COLORS[(h >>> 16) % LUCKY_COLORS.length]
  const number = (h >>> 24) % 28 + 1
  return { text, color, number, luck }
}
function renderCalPlaque() {
  const s = seasonOf()
  const html = '<span class="cal-chip ' + s.id + '">' + s.name + '</span>'

  for (const id of ['cal-plaque', 'cal-plaque-title']) {
    const el = document.getElementById(id)
    if (el) el.innerHTML = html

}

  resetWeather()
}

  if (state.sound) {

}
function showSeasonBanner(text) {

/** 日历弹窗：28 日月历 + 今日运势。 */
function openCalendar() {
  const body = document.createElement('div')
  const s = seasonOf()
  const head = document.createElement('div')
  head.className = 'cal-weekhead'
  for (const w of WEEKDAYS) {
    const sp = document.createElement('span')
    sp.textContent = w
    head.appendChild(sp)
  }

    cell.textContent = d

  body.appendChild(head); body.appendChild(grid); body.appendChild(fortune)

/* ---------- 天气粒子：花瓣 / 萤火 / 落叶 / 雪 ---------- */
const weatherFx = { canvas: null, ctx: null, parts: [], raf: 0, dpr: 1 }
function weatherConf() {
  const id = seasonOf().id
  if (id === 'spring') return { count: 26, colors: ['#f6c6d9', '#fad2e2', '#f3b3cc'], shape: 'petal', speed: 0.45 }
  if (id === 'summer') return { count: 18, colors: ['#fff3b0', '#ffe97a', '#d8f0a0'], shape: 'fly', speed: 0.18 }
  if (id === 'fall')   return { count: 22, colors: ['#d9822b', '#c9701d', '#b85a1a', '#e0a13c'], shape: 'leaf', speed: 0.6 }
  return { count: 40, colors: ['#ffffff', '#f3f8ff', '#e8f1fb'], shape: 'snow', speed: 0.5 }
}
function makeParticle(conf, spawnTop) {
  const w = innerWidth, h = innerHeight
  return {
    x: Math.random() * w,
    y: spawnTop ? -12 : Math.random() * h,
    size: conf.shape === 'fly' ? 1.6 + Math.random() * 1.8 : 3 + Math.random() * 4,
    vy: (0.35 + Math.random() * 0.65) * conf.speed,
    vx: (Math.random() - 0.5) * 0.3,
    rot: Math.random() * Math.PI * 2,
    vr: (Math.random() - 0.5) * 0.03,
    phase: Math.random() * Math.PI * 2,
    color: conf.colors[(Math.random() * conf.colors.length) | 0],
  }
}
function weatherFrame() {
  const c = weatherFx.canvas, ctx = weatherFx.ctx
  ctx.clearRect(0, 0, c.width, c.height)
  const conf = weatherConf()
  for (const p of weatherFx.parts) {
    p.phase += 0.02
    p.y += p.vy
    p.x += p.vx + (conf.shape === 'fly' ? Math.sin(p.phase * 1.7) * 0.5 : Math.sin(p.phase) * 0.35)
    p.rot += p.vr
    if (p.y > innerHeight + 14 || p.x < -20 || p.x > innerWidth + 20) Object.assign(p, makeParticle(conf, true))
    ctx.save()
    ctx.translate(p.x, p.y)
    ctx.globalAlpha = conf.shape === 'fly' ? 0.35 + Math.abs(Math.sin(p.phase)) * 0.6 : 0.75
    ctx.fillStyle = p.color
    if (conf.shape === 'petal') {
      ctx.rotate(p.rot)
      ctx.beginPath(); ctx.ellipse(0, 0, p.size, p.size * 0.55, 0, 0, Math.PI * 2); ctx.fill()
    } else if (conf.shape === 'leaf') {
      ctx.rotate(p.rot)
      ctx.fillRect(-p.size / 2, -p.size / 4, p.size, p.size / 2)
    } else if (conf.shape === 'fly') {
      ctx.shadowColor = p.color; ctx.shadowBlur = 6
      ctx.beginPath(); ctx.arc(0, 0, p.size, 0, Math.PI * 2); ctx.fill()
    } else {
      ctx.beginPath(); ctx.arc(0, 0, p.size * 0.8, 0, Math.PI * 2); ctx.fill()
    }
    ctx.restore()
  }
  weatherFx.raf = requestAnimationFrame(weatherFrame)
}
function resetWeather() {
  if (!weatherFx.canvas) {
    weatherFx.canvas = $('#weather-canvas')
    weatherFx.ctx = weatherFx.canvas.getContext('2d')
    const fit = () => {
      weatherFx.dpr = Math.min(devicePixelRatio || 1, 2)
      weatherFx.canvas.width = innerWidth * weatherFx.dpr
      weatherFx.canvas.height = innerHeight * weatherFx.dpr
      weatherFx.ctx.setTransform(weatherFx.dpr, 0, 0, weatherFx.dpr, 0, 0)
    }
    fit()
    weatherFx.canvas.__fit = fit
    addEventListener('resize', fit)
    document.addEventListener('visibilitychange', () => {
      if (document.hidden) { cancelAnimationFrame(weatherFx.raf); weatherFx.raf = 0 }
      else if (state.weather && !weatherFx.raf) weatherFx.raf = requestAnimationFrame(weatherFrame)
    })
  }
  weatherFx.canvas.__fit()
  cancelAnimationFrame(weatherFx.raf)
  weatherFx.raf = 0
  // 系统开了「减少动态效果」时把粒子视为关闭（用户仍可显式打开，尊重 setWeather 的显式值）
  const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches
  if (!state.weather || reduced) return
  const conf = weatherConf()
  weatherFx.parts = Array.from({ length: conf.count }, () => makeParticle(conf, false))
  weatherFx.raf = requestAnimationFrame(weatherFrame)
}
function setWeather(on) {
  state.weather = on
  localStorage.setItem('stardew.weather', on ? '1' : '0')
  resetWeather()
}
function setSeasonTint(on) {
  state.seasonTint = on
  localStorage.setItem('stardew.seasonTint', on ? '1' : '0')
  applySeasonLook()
}

/* ---------- 轻量 Markdown 渲染（零依赖；先整体转义再解析，模型输出不注入 HTML） ---------- */
function escHtml(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]))
}
function escCode(s) { return String(s ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;') }

/** 极简语法着色（输入须先经 escCode，引号保留原样）；不支持的语言原样返回。 */
const MD_HL = {
  js: {
    re: /(\/\/[^\n]*|\/\*[\s\S]*?\*\/)|("(?:[^"\\\n]|\\.)*"|'(?:[^'\\\n]|\\.)*'|`(?:[^`\\]|\\.)*`)|\b(const|let|var|function|return|if|else|for|while|do|of|in|new|class|extends|super|import|from|export|default|async|await|try|catch|finally|throw|switch|case|break|continue|typeof|instanceof|delete|void|yield|this|null|undefined|true|false|static)\b|\b(0x[0-9a-fA-F]+|\d+(?:\.\d+)?)\b/g,
    cls: ['tok-com', 'tok-str', 'tok-kw', 'tok-num'],
  },
  py: {
    re: /(#[^\n]*)|("""[\s\S]*?"""|'''[\s\S]*?'''|"(?:[^"\\\n]|\\.)*"|'(?:[^'\\\n]|\\.)*')|\b(def|class|return|if|elif|else|for|while|in|not|and|or|is|import|from|as|with|try|except|finally|raise|lambda|yield|pass|break|continue|global|assert|del|None|True|False|self|async|await)\b|\b(0x[0-9a-fA-F]+|\d+(?:\.\d+)?)\b/g,
    cls: ['tok-com', 'tok-str', 'tok-kw', 'tok-num'],
  },
  sh: {
    re: /(#[^\n]*)|("(?:[^"\\\n]|\\.)*"|'[^'\n]*')|\b(if|then|else|elif|fi|for|while|until|do|done|case|esac|function|in|return|local|export|echo|source|alias|exit|cd|ls|cat|grep|sed|awk|curl|git|npm|pnpm|node|python|pip|mkdir|rm|cp|mv|chmod|sudo|make)\b|\b(\d+)\b/g,
    cls: ['tok-com', 'tok-str', 'tok-kw', 'tok-num'],
  },
  json: {
    re: /("(?:[^"\\\n]|\\.)*")(\s*:)?|\b(true|false|null)\b|(-?\d+(?:\.\d+)?(?:[eE][+-]?\d+)?)/g,
    cls: ['tok-str', '', 'j-bool', 'j-num'],
    // JSON 特例：带冒号的串是键（金色），命中时第二捕获组跟随上色
  },
  html: {
    re: /(<!--[\s\S]*-->|<!DOCTYPE[^>]*>)|("(?:[^"\\\n]|\\.)*"|'(?:[^'\\\n]|\\.)*')|(<\/?[a-zA-Z][\w-]*|\/?>)/g,
    cls: ['tok-com', 'tok-str', 'tok-tag'],
  },
}
const MD_HL_LANG = (l) => ({
  js: 'js', javascript: 'js', jsx: 'js', mjs: 'js', cjs: 'js', node: 'js', ts: 'js', typescript: 'js', tsx: 'js',
  py: 'py', python: 'py', python3: 'py',
  bash: 'sh', sh: 'sh', shell: 'sh', zsh: 'sh', console: 'sh', terminal: 'sh',
  json: 'json', jsonc: 'json', json5: 'json',
  html: 'html', xml: 'html', svg: 'html', vue: 'html',
})[String(l || '').toLowerCase()]

function mdHighlight(escapedCode, lang) {
  const fam = MD_HL_LANG(lang)
  const rule = fam && MD_HL[fam]
  if (!rule) return escapedCode
  return escapedCode.replace(rule.re, function (m, g1, g2, g3, g4) {
    // JSON 特例：字符串后跟冒号是键（金色），否则是值（绿色）
    if (fam === 'json' && g1 !== undefined) return '<span class="' + (g2 ? 'j-key' : 'tok-str') + '">' + g1 + '</span>' + (g2 || '')
    const groups = [g1, g2, g3, g4]
    for (let k = 0; k < groups.length; k++) {
      if (groups[k] !== undefined) return '<span class="' + rule.cls[k] + '">' + groups[k] + '</span>'
    }
    return m
  })
}

/** 行内格式（输入须已转义）：代码 span 先占位保护，再图片→链接→加粗→斜体→删除线。 */
function mdInline(s) {
  const codes = []
  s = s.replace(/`([^`\n]+)`/g, (_, c) => { codes.push('<code>' + c + '</code>'); return '\x00' + (codes.length - 1) + '\x00' })
  s = s.replace(/!\[([^\]\n]*)\]\(([^)\s]+)\)/g, (_, alt, url) =>
    /^(https?:|\/|#)/i.test(url) ? '<a href="' + url + '" target="_blank" rel="noopener">🖼 ' + (alt || url) + '</a>' : alt + '（' + url + '）')
  s = s.replace(/\[([^\]\n]+)\]\(([^)\s]+)\)/g, (_, text, url) =>
    /^(https?:|\/|#|mailto:)/i.test(url) ? '<a href="' + url + '" target="_blank" rel="noopener">' + text + '</a>' : text + '（' + url + '）')
  s = s.replace(/\*\*([^*\n]+)\*\*/g, '<strong>$1</strong>')
  s = s.replace(/(^|[^*])\*([^*\n]+)\*(?!\*)/g, '$1<em>$2</em>')
  s = s.replace(/~~([^~\n]+)~~/g, '<del>$1</del>')
  return s.replace(/\x00(\d+)\x00/g, (_, i) => codes[+i])
}

function splitTableRow(line) {
  let s = line.trim()
  if (s.startsWith('|')) s = s.slice(1)
  if (s.endsWith('|')) s = s.slice(0, -1)
  return s.split('\\|').join('\x01').split('|').map(c => c.trim().split('\x01').join('|'))
}

function renderList(items) {
  // 相邻同类型项合成一张表；有序/无序切换处分段（CommonMark 惯例）
  let html = ''
  let run = null
  const flush = () => {
    if (!run) return
    html += (run.ordered ? '<ol>' : '<ul>')
      + run.items.map(it => {
        const rest = it.text.slice(1).join('\n')
        return '<li>' + mdInline(escHtml(it.text[0])) + (rest.trim() ? mdToHtml(rest) : '') + '</li>'
      }).join('')
      + (run.ordered ? '</ol>' : '</ul>')
    run = null
  }
  for (const it of items) {
    if (!run || run.ordered !== it.ordered) flush()
    if (run) run.items.push(it)
    else run = { ordered: it.ordered, items: [it] }
  }
  flush()
  return html
}

function renderCodebox(lang, code) {
  return '<div class="codebox"><div class="codebox-head"><span>' + escHtml(lang || 'text') + '</span>'
    + '<button type="button" class="codebox-copy" data-code="' + escHtml(code) + '">复制</button></div>'
    + '<pre><code>' + mdHighlight(escCode(code), lang) + '</code></pre></div>'
}

/** 块级解析：围栏代码/标题/引用/列表/表格/段落。流式容忍未闭合围栏（EOF 视为闭合）。 */
function mdToHtml(text) {
  const lines = String(text ?? '').replace(/\r\n?/g, '\n').split('\n')
  const out = []
  let i = 0
  while (i < lines.length) {
    const line = lines[i]
    const fence = line.match(/^\s*(```+|~~~+) *([\w+#./-]*)\s*$/)
    if (fence) {
      const close = new RegExp('^\\s*' + fence[1] + '+\\s*$')
      const buf = []
      i++
      while (i < lines.length && !close.test(lines[i])) buf.push(lines[i++])
      i++
      out.push(renderCodebox(fence[2], buf.join('\n')))
      continue
    }
    let m = line.match(/^\s{0,3}(#{1,6})\s+(.*?)\s*#*\s*$/)
    if (m) { const n = m[1].length; out.push('<h' + n + '>' + mdInline(escHtml(m[2])) + '</h' + n + '>'); i++; continue }
    if (/^\s{0,3}([-*_])( *\1){2,} *$/.test(line)) { out.push('<hr>'); i++; continue }
    if (line.includes('|') && i + 1 < lines.length && /^\s*\|?\s*:?-+:?\s*(\|\s*:?-+:?\s*)+\|?\s*$/.test(lines[i + 1])) {
      const header = splitTableRow(line)
      const aligns = splitTableRow(lines[i + 1]).map(c => c.startsWith(':') && c.endsWith(':') ? ' style="text-align:center"' : c.endsWith(':') ? ' style="text-align:right"' : '')
      i += 2
      const rows = []
      while (i < lines.length && lines[i].includes('|') && lines[i].trim() !== '') rows.push(splitTableRow(lines[i++]))
      const cell = (c, x, tag) => '<' + tag + (aligns[x] || '') + '>' + mdInline(escHtml(c ?? '')) + '</' + tag + '>'
      out.push('<table><thead><tr>' + header.map((c, x) => cell(c, x, 'th')).join('') + '</tr></thead><tbody>'
        + rows.map(r => '<tr>' + header.map((_, x) => cell(r[x], x, 'td')).join('') + '</tr>').join('') + '</tbody></table>')
      continue
    }
    if (/^\s{0,3}>/.test(line)) {
      const buf = []
      while (i < lines.length && /^\s{0,3}>/.test(lines[i])) buf.push(lines[i++].replace(/^\s{0,3}>\s?/, ''))
      out.push('<blockquote>' + mdToHtml(buf.join('\n')) + '</blockquote>')
      continue
    }
    m = line.match(/^(\s*)([-*+]|\d+[.)])\s+(.*)$/)
    if (m) {
      const items = []
      let cur = null
      while (i < lines.length) {
        const lm = lines[i].match(/^(\s*)([-*+]|\d+[.)])\s+(.*)$/)
        if (lm) {
          const indent = lm[1].length
          if (!cur || indent <= cur.indent) { cur = { indent, ordered: /\d/.test(lm[2]), text: [lm[3]] }; items.push(cur) }
          else cur.text.push(lm[2] + ' ' + lm[3]) // 更深一级：保留列表标记，子列表交给递归
          i++
        } else if (lines[i].trim() !== '' && cur && /^ {2,}/.test(lines[i])) { cur.text.push(lines[i].trim()); i++ }
        else if (lines[i].trim() === '' && i + 1 < lines.length && /^\s*([-*+]|\d+[.)])\s+/.test(lines[i + 1])) { i++ }
        else break
      }
      out.push(renderList(items))
      continue
    }
    if (line.trim() === '') { i++; continue }
    const buf = [line]
    i++
    while (i < lines.length && lines[i].trim() !== ''
      && !/^\s*(```+|~~~+)/.test(lines[i]) && !/^\s{0,3}#{1,6}\s/.test(lines[i])
      && !/^\s{0,3}>/.test(lines[i]) && !/^(\s*)([-*+]|\d+[.)])\s+/.test(lines[i])
      && !/^\s{0,3}([-*_])( *\1){2,} *$/.test(lines[i])) buf.push(lines[i++])
    out.push('<p>' + buf.map(l => mdInline(escHtml(l))).join('<br>') + '</p>')
  }
  return out.join('')
}

/* ---------- 基础 RPC ---------- */
class RpcError extends Error {
  constructor(code, message) { super(message); this.code = code }
}
async function rpc(method, args) {
  const res = await fetch('/api/' + method, {
    method: 'POST',
    headers: { 'content-type': 'application/json' },
    body: JSON.stringify({ type: 'client-request', rpcId: crypto.randomUUID(), method, payload: { args: args || {} } }),
  })
  if (!res.ok) throw new Error('传输失败 ' + method + ': HTTP ' + res.status)
  const full = await res.json()
  if (!full.result.ok) throw new RpcError(full.result.error.code, full.result.error.message)
  return full.result.value
}
/** 应答 $events 流里的 waterfall 事件（审批/提问）；value 省略时表示「我不处理，交给下一家」。 */
async function eventResult(eventId, value) {
  if (!state.clientId) throw new Error('事件流尚未就绪，无法应答')
  const outcome = value === undefined ? { kind: 'next' } : { kind: 'result', value }
  const res = await fetch('/api/$events/result', {
    method: 'POST',
    headers: { 'content-type': 'application/json' },
    body: JSON.stringify({
      type: 'client-request', rpcId: crypto.randomUUID(), method: '$events/result',
      payload: { args: { clientId: state.clientId, eventId, outcome } },
    }),
  })
  if (!res.ok) throw new Error('应答失败: HTTP ' + res.status)
  const full = await res.json()
  if (full.result && !full.result.ok) throw new RpcError(full.result.error.code, full.result.error.message)
}

/* ---------- 音效（8-bit 简短 beep，WebAudio） ---------- */
let audioCtx = null
function beep(freq, dur) {
  if (!state.sound) return
  try {
    audioCtx = audioCtx || new AudioContext()
    const osc = audioCtx.createOscillator()
    const gain = audioCtx.createGain()
    osc.type = 'square'
    osc.frequency.value = freq
    gain.gain.value = 0.04
    osc.connect(gain); gain.connect(audioCtx.destination)
    osc.start()
    osc.stop(audioCtx.currentTime + dur)
  } catch { /* 无声环境忽略 */ }
}

/* ---------- 连接状态 ---------- */
function setConn(on) {

}

/* ---------- WebSocket 事件流（/api/remote.mux 多路复用） ---------- */
function connectWs() {
  const proto = location.protocol === 'https:' ? 'wss:' : 'ws:'
  let ws
  try { ws = new WebSocket(proto + '//' + location.host + '/api/remote.mux') } catch { scheduleReconnect(); return }
  state.ws = ws
  ws.addEventListener('open', () => {
    setConn(true)
    // 旧连接上的逻辑流全部失效，重建 $events 与当前会话的 follow 流
    state.wsStreams.clear()
    state.followStreamId = null
    state.clientId = null
    openStream('$events', { args: {} }, handleEventsItem)
    if (state.sessionId) followSession(state.sessionId, !state.historyLoaded)
  })
  ws.addEventListener('message', (ev) => {
    let frame
    try { frame = JSON.parse(ev.data) } catch { return }
    if (frame.type === 'item') {
      const s = state.wsStreams.get(frame.streamId)
      if (s) s.onItem(frame.value)
    } else if (frame.type === 'end') {
      const s = state.wsStreams.get(frame.streamId)
      state.wsStreams.delete(frame.streamId)
      if (s && s.onEnd) s.onEnd()
    } else if (frame.type === 'error') {
      const s = state.wsStreams.get(frame.streamId)
      state.wsStreams.delete(frame.streamId)
      const msg = frame.error && frame.error.message ? frame.error.message : '未知'
      if (s && s.onEnd) s.onEnd(new Error(msg))
      else toast('事件流错误：' + msg, 'err')
    }
  })
  ws.addEventListener('close', () => { setConn(false); state.clientId = null; scheduleReconnect() })
  ws.addEventListener('error', () => { })
}
function scheduleReconnect() {
  if (state.wsTimer) return
  state.wsTimer = setTimeout(() => { state.wsTimer = null; connectWs() }, 2000)
}
/** 在 remote.mux 上开一条逻辑流；onItem(value) 收 item 帧，onEnd(err?) 收 end/error 帧。 */
function openStream(endpoint, payload, onItem, onEnd) {
  if (!state.ws || state.ws.readyState !== WebSocket.OPEN) throw new Error('事件流未连接')
  const streamId = crypto.randomUUID()
  state.wsStreams.set(streamId, { onItem, onEnd })
  state.ws.send(JSON.stringify({ type: 'open', streamId, endpoint, payload }))
  return streamId
}
function closeStream(streamId) {
  if (!streamId) return
  if (state.ws && state.ws.readyState === WebSocket.OPEN) {
    try { state.ws.send(JSON.stringify({ type: 'cancel', streamId })) } catch { /* 连接已断 */ }
  }
  state.wsStreams.delete(streamId)
}

/* ---------- $events 流：广播事件 + 需应答的 waterfall 事件 ---------- */
function handleEventsItem(value) {
  if (!value || typeof value !== 'object') return
  if (value.type === 'ready') {
    state.clientId = value.clientId
    termLine('已接入星露谷事件总线', 't-dim')
    return
  }
  if (value.type === 'emit') { handleEmit(value.event, value.args || []); return }
  if (value.type === 'waterfall') { handleWaterfall(value); return }
}
function handleEmit(event, args) {
  switch (event) {
    case 'api-session/added':
    case 'api-session/status': {
      const s = args[0]
      if (s && s.sessionId === state.sessionId && typeof s.running === 'boolean') setRunning(s.running)
      break
    }
    case 'agent-preset/selected': {
      // args: [sessionId, agentPreset]
      if (args[0] === state.sessionId && args[1]) {
        state.agentPreset = args[1]
        $('#main-session-name').textContent = (PRESET_NAMES[args[1]] || args[1])
          + (state.workspaceTitle ? '@' + state.workspaceTitle : '')
      }
      break
    }
    case 'settings/document-updated':
      refreshKeyStatus()
      break
    default:
      break
  }
}
function handleWaterfall(frame) {
  switch (frame.event) {
    case 'approval/request':
      handleApproval(frame.eventId, frame.request || {})
      break
    case 'user-questions/request':
      handleQuestion(frame.eventId, frame.request || {})
      break
    default:
      // 不认识的事件一律 next，避免阻塞宿主瀑布
      eventResult(frame.eventId, undefined).catch(() => { })
      break
  }
}

/* ---------- 会话日志流（session/follow）：快照回放 + 实时事件 ---------- */
function followSession(sessionId, replay) {
  if (state.followStreamId) { closeStream(state.followStreamId); state.followStreamId = null }
  const sid = sessionId
  let streamId
  try {
    streamId = openStream('session/follow',
    { args: { request: { address: { kind: 'session', sessionId: sid }, maxMessages: 200 } } },
    (value) => {
      if (!value || typeof value !== 'object') return
      if (value.type === 'snapshot') {
        if (value.header && value.header.agentPreset) state.agentPreset = value.header.agentPreset
        if (replay) replaySnapshot(value)
        state.historyLoaded = true
      } else if (value.type === 'event') {
        handleSessionEvent(sid, value.event, false)
      }
    },
    (err) => {
      if (state.followStreamId && err) termLine('会话流断开：' + err.message, 't-err')
    })
  } catch (e) {
    termLine('会话流打开失败：' + e.message, 't-err')
    return
  }
  state.followStreamId = streamId
}
function replaySnapshot(snap) {
  $('#messages').innerHTML = ''
  state.toolBlocks.clear()
  state.streamEl = null
  state.streamWrap = null
  state.streamRaw = ''
  state.reasonRaw = ''
  state.reasonEl = null
  if (state.streamTimer) { clearTimeout(state.streamTimer); state.streamTimer = 0 }
  let lastTodos = null
  for (const rec of snap.records || []) {
    // chunks 记录是打包的助手增量流；定稿 assistant/message 会完整渲染，回放跳过
    if (rec.type !== 'event') continue
    const ev = rec.event
    if (ev.type === 'todo/write') lastTodos = ev.data.todos
    if (ev.type === 'assistant/chunk') continue
    handleSessionEvent(state.sessionId, ev, true)
  }
  if (lastTodos) renderTodos(lastTodos)
  appendSysLine('—— 历史已加载 ——')
}

/* ---------- 会话事件渲染 ---------- */
function blocksText(content) {
  if (!Array.isArray(content)) return ''
  return content.filter(b => b && b.type === 'text').map(b => b.text).join('')
}
function blocksReasoning(content) {
  if (!Array.isArray(content)) return ''
  return content.filter(b => b && b.type === 'reasoning').map(b => b.text).join('\n')
}

/** 复制文本到剪贴板：优先 Clipboard API（安全上下文），退回 execCommand 兼容局域网 HTTP 访问。 */
function copyText(text) {
  const t = String(text ?? '')
  const fallback = () => {
    try {
      const ta = document.createElement('textarea')
      ta.value = t
      ta.style.cssText = 'position:fixed;opacity:0;pointer-events:none'
      document.body.appendChild(ta)
      ta.select()
      const ok = document.execCommand('copy')
      ta.remove()
      return ok
    } catch { return false }
  }
  const done = ok => toast(ok ? '已复制到剪贴板' : '复制失败', ok ? 'ok' : 'err')
  if (navigator.clipboard && window.isSecureContext) {
    navigator.clipboard.writeText(t).then(() => done(true), () => done(fallback()))
  } else {
    done(fallback())
  }
}
/** 构建消息复制按钮；getText 闭包取实时文本，流式消息定稿前后都可复制。 */

/** 流式期间节流重渲 markdown：120ms 一帧，避免每 delta 全量解析。 */
function scheduleStreamRender() {

/** 流式思考块：reasoning-delta 实时显示；正文开写后折叠，定稿沿用。 */
function ensureReasoningBlock() {
  if (state.reasonEl) return state.reasonEl
  const det = document.createElement('details')
  det.className = 'msg-reasoning'
  det.open = true
  const sum = document.createElement('summary')
  sum.className = 'live'
  sum.textContent = '思考中…'
  const rb = document.createElement('div')
  rb.className = 'r-body'
  det.appendChild(sum); det.appendChild(rb)
  const anchor = state.streamWrap || null
  $('#messages').insertBefore(det, anchor)
  state.reasonEl = det
  return det
}
function foldReasoningBlock(reasoningText) {
  const det = state.reasonEl
  state.reasonRaw = reasoningText
  state.reasonEl = null
  if (!det) return
  const sum = det.querySelector('summary')
  const rb = det.querySelector('.r-body')
  if (sum) { sum.classList.remove('live'); sum.textContent = '思考过程' }
  if (rb) rb.textContent = reasoningText || ''
  det.open = false
  if (!reasoningText) det.remove()
}
function finalizeAssistant(message, usage) {
  const text = blocksText(message.content)
  const reasoning = blocksReasoning(message.content)
  if (state.streamTimer) { clearTimeout(state.streamTimer); state.streamTimer = 0 }
  // 流式路径已有实时思考块则沿用它；回放路径（无 chunk 事件）在此兜底创建
  if (reasoning) { ensureReasoningBlock(); foldReasoningBlock(reasoning) }
  else foldReasoningBlock('')
  const body = state.streamEl || startAssistantStream()
  body.innerHTML = mdToHtml(text)
  // 名牌行补复制按钮（历史回放与实时流共用本函数；stream 中途无按钮，定稿即有）；
  // 复制的是原始 markdown 文本，不是渲染后的 HTML
  const nameRow = body.parentNode ? body.parentNode.querySelector('.msg-name') : null
  if (nameRow && !nameRow.querySelector('.msg-copy')) nameRow.appendChild(msgCopyBtn(() => text))
  if (usage && (usage.inputTokens !== undefined || usage.totalTokens !== undefined)) {
    const u = document.createElement('div')
    u.className = 'msg-usage'
    const total = usage.totalTokens ?? ((usage.inputTokens ?? 0) + (usage.outputTokens ?? 0))
    // totalTokens 是整次调用的全量口径（含缓存读取），通常大于 输入+输出 的表面和
    u.textContent = 'tokens: 总计 ' + total + '（输入 ' + (usage.inputTokens ?? '?') + ' / 输出 ' + (usage.outputTokens ?? '?') + '）'
    body.parentNode.appendChild(u)
    updateEnergy(usage)
  }
  state.streamEl = null
  state.streamWrap = null
  state.streamRaw = ''
  scrollMsgs()
}

/* ---------- 上下文能量条：以最近一轮输入 tokens（含缓存命中）估算上下文占用 ---------- */
function updateEnergy(usage) {
  const fill = $('#energy-fill')
  const pct = $('#energy-pct')
  if (!fill || !pct || !usage) return
  // rc.1 TokenUsage：inputTokens 不含缓存命中，上下文占用要加上 cacheReadTokens
  const used = Number(usage.inputTokens ?? 0) + Number(usage.cacheReadTokens ?? 0) || Number(usage.totalTokens)
  if (!Number.isFinite(used) || used <= 0) return
  const remain = Math.max(0, Math.min(1, 1 - used / state.ctxCap))
  fill.style.height = (remain * 100).toFixed(1) + '%'
  fill.style.background = remain > 0.5 ? 'var(--energy)' : (remain > 0.2 ? 'var(--gold)' : 'var(--barn-red)')
  pct.textContent = Math.round(remain * 100) + '%'
  pct.classList.toggle('low', remain <= 0.2)
  pct.title = '本轮回 prompt ' + used + ' / 标称上下文 ' + state.ctxCap + ' tokens（可用 stardew.ctxCap 调整）'
}

/** JSON 着色：可解析时格式化并按键/串/数着色，否则按纯文本转义返回。 */
function jsonTint(text) {
  const raw = String(text ?? '')
  let obj
  try { obj = JSON.parse(raw) } catch { return escCode(raw) }
  const pretty = (obj !== null && typeof obj === 'object') ? JSON.stringify(obj, null, 2) : raw
  return escCode(pretty).replace(/("(?:[^"\\\n]|\\.)*")(\s*:)?|\b(true|false|null)\b|(-?\d+(?:\.\d+)?(?:[eE][+-]?\d+)?)/g,
    (m, str, colon, bool, num) => {
      if (str) return '<span class="' + (colon ? 'j-key' : 'j-str') + '">' + str + '</span>' + (colon || '')
      if (bool) return '<span class="j-bool">' + bool + '</span>'
      if (num) return '<span class="j-num">' + num + '</span>'
      return m
    })
}

function finishToolBlock(callId, resultText, isError) {

function handleSessionEvent(sid, event, replay) {
  if (sid !== state.sessionId) return
  const d = event.data || {}
  switch (event.type) {
    case 'user/message': {
      /* 系统注入的上下文（skills 目录、工作区规则等）source.kind 不是 'user'，
         官方 UI 将其渲染为低权重 context 节点；这里直接跳过，不进入聊天流。 */
      if (d.source && d.source.kind !== 'user') break
      const text = blocksText(d.content) || '(非文本消息)'
      if (!replay && state.pendingUserText === text) {
        removePendingUserMsgs()
        state.pendingUserText = null
      }
      appendUserMsg(text, false)
      break
    }
    case 'assistant/chunk': {
      if (replay) break
      const c = d.chunk
      if (!c) break
      if (c.type === 'text-delta') {
        startAssistantStream()
        state.streamRaw += c.text
        scheduleStreamRender()
      } else if (c.type === 'reasoning-delta') {
        // 思考增量实时上屏（点阵行让位给真实思考文本）
        hideThinking()
        const det = ensureReasoningBlock()
        state.reasonRaw += c.text
        const rb = det.querySelector('.r-body')
        rb.textContent = state.reasonRaw
        rb.scrollTop = rb.scrollHeight
        scrollMsgs()
      }
      break
    }
    case 'assistant/message':
      finalizeAssistant(d.message, d.usage)
      beep(660, 0.06)
      break
    case 'tool/call':
      appendToolBlock(d.callId, d.name, d.arguments)
      break
    case 'tool/result': {
      // rc.1：callId 收进 message.content[0]（ToolResultBlock.toolCallId），不再在事件顶层
      const block = Array.isArray(d.message && d.message.content) ? d.message.content[0] : null
      const text = block && Array.isArray(block.content) ? blocksText(block.content) : ''
      finishToolBlock(block && block.toolCallId, text, Boolean(d.error) || Boolean(block && block.isError))
      break
    }
    case 'turn/start':
      setRunning(true)
      showThinking()
      break
    case 'turn/end': {
      setRunning(false)
      const r = d.reason || {}
      if (r.kind === 'error') {
        const msg = r.error && r.error.message ? r.error.message : '请求失败'
        appendSysLine('⚠ ' + msg, true)
        termLine('回合失败: ' + msg, 't-err')
        beep(180, 0.15)
      } else if (r.kind === 'aborted') {
        appendSysLine('农活被中断')
      } else if (r.kind === 'max-tokens') {
        appendSysLine('达到单步输出上限')
      }
      if (state.streamTimer) { clearTimeout(state.streamTimer); state.streamTimer = 0 }
      if (state.streamEl && state.streamEl.textContent === '') { state.streamWrap.remove(); state.streamEl = null; state.streamWrap = null }
      state.streamRaw = ''
      // 空思考块（只有点阵没有内容）随回合结束清掉
      if (state.reasonEl && !state.reasonRaw) { state.reasonEl.remove(); state.reasonEl = null }
      state.reasonRaw = ''
      break
    }
    case 'todo/write':
      renderTodos(d.todos)
      break
    default:
      break
  }
}

      dt.style.color = 'var(--stone)'

      wrap.appendChild(dt)

    for (const opt of q.options || []) {
      const btn = document.createElement('button')
      btn.className = 'opt-btn'

        const de = document.createElement('span')

      }
      btn.addEventListener('click', () => {

        if (q.multiSelect) {

          if (i >= 0) cur.splice(i, 1); else cur.push(opt.label)
          btn.style.borderColor = cur.includes(opt.label) ? 'var(--gold)' : 'var(--black)'
          answers.set(q.id, cur)
        } else {
          answers.set(q.id, [opt.label])
          wrap.querySelectorAll('.opt-btn').forEach(b => (b.style.borderColor = 'var(--black)'))
          btn.style.borderColor = 'var(--gold)'

  }
  openModal(state.npcName + '的提问', body, [
    { label: '取消', danger: true, onClick: () => eventResult(eventId, { answers: qs.map(q => ({ id: q.id, selected: [], custom: '取消' })) }).catch(e => toast(e.message, 'err')) },
    {
      label: '回答', gold: true, onClick: () => {
        const arr = qs.map(q => {
          const sel = answers.get(q.id) || []
          const cus = answers.get(q.id + ':custom') || ''
          return { id: q.id, selected: sel, ...(cus ? { custom: cus } : {}) }
        })
        eventResult(eventId, { answers: arr }).catch(e => toast(e.message, 'err'))
      }
    },
  ])
}

/* ---------- 壁纸（图片 localStorage；视频 blob 存 IndexedDB） ---------- */
let wpVideoUrl = null
function wpDb() {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open('stardew-wallpaper', 1)
    req.onupgradeneeded = () => { req.result.createObjectStore('kv') }
    req.onsuccess = () => resolve(req.result)
    req.onerror = () => reject(req.error)
  })
}
function wpDbPut(blob, key = 'video') {
  return wpDb().then(db => new Promise((resolve, reject) => {
    const tx = db.transaction('kv', 'readwrite')
    tx.objectStore('kv').put(blob, key)
    tx.oncomplete = () => resolve()
    tx.onerror = () => reject(tx.error)
  }))
}
function wpDbGet(key = 'video') {
  return wpDb().then(db => new Promise((resolve, reject) => {
    const tx = db.transaction('kv', 'readonly')
    const rq = tx.objectStore('kv').get(key)
    rq.onsuccess = () => resolve(rq.result || null)
    rq.onerror = () => reject(rq.error)
  }))
}
function wpDbClear(key = 'video') {
  return wpDb().then(db => new Promise((resolve, reject) => {
    const tx = db.transaction('kv', 'readwrite')
    tx.objectStore('kv').delete(key)
    tx.oncomplete = () => resolve()
    tx.onerror = () => reject(tx.error)
  }))
}
async function applyWallpaper() {
  const video = $('#wp-video')
  let blob = null
  try { blob = await wpDbGet() } catch { /* IndexedDB 不可用时退回静态壁纸 */ }
  if (blob) {
    if (wpVideoUrl) URL.revokeObjectURL(wpVideoUrl)
    wpVideoUrl = URL.createObjectURL(blob)
    video.src = wpVideoUrl
    video.style.display = 'block'
    video.play().catch(() => { })
    document.body.style.backgroundImage = ''
    return
  }
  video.removeAttribute('src')
  video.style.display = 'none'
  if (wpVideoUrl) { URL.revokeObjectURL(wpVideoUrl); wpVideoUrl = null }
  const wp = localStorage.getItem('stardew.wallpaper')
  document.body.style.backgroundImage = wp ? 'url("' + wp + '")' : ''
}
function loadWallpaperFile(file) {
  if (file.type.startsWith('video/')) {
    if (file.size > 512 * 1024 * 1024) { toast('视频超过 512MB，无法使用', 'err'); return }
    wpDbPut(file)
      .then(() => { localStorage.removeItem('stardew.wallpaper'); return applyWallpaper() })
      .then(() => toast('动态壁纸已更换', 'ok'))
      .catch(e => toast('视频保存失败: ' + (e && e.message ? e.message : e), 'err'))
    return
  }
  if (!file.type.startsWith('image/')) { toast('请选择图片或视频文件', 'err'); return }
  const finish = (data) => {
    try { localStorage.setItem('stardew.wallpaper', data) }
    catch { toast('图片过大，保存失败（压缩后仍超限）', 'err'); return }
    wpDbClear().then(applyWallpaper)
    toast('壁纸已更换', 'ok')
  }
  const reader = new FileReader()
  reader.onload = () => {
    // GIF 直接存原文件以保留动画；其余压缩到 1920px JPEG 控制存储体积。
    if (file.type === 'image/gif') { finish(String(reader.result)); return }
    const img = new Image()
    img.onload = () => {
      const scale = Math.min(1, 1920 / Math.max(img.width, img.height))
      const w = Math.round(img.width * scale), h = Math.round(img.height * scale)
      const cv = document.createElement('canvas')
      cv.width = w; cv.height = h
      cv.getContext('2d').drawImage(img, 0, 0, w, h)
      finish(cv.toDataURL('image/jpeg', 0.85))
    }
    img.onerror = () => toast('图片读取失败', 'err')
    img.src = String(reader.result)
  }
  reader.readAsDataURL(file)
}
/** 给投放区（或任意元素）接上拖拽上传：dragover 高亮，drop 取第一个文件。 */
function bindWallpaperDrop(zone, load = loadWallpaperFile) {
  zone.addEventListener('dragover', (ev) => {
    ev.preventDefault()
    ev.dataTransfer.dropEffect = 'copy'
    zone.classList.add('drag')
  })
  zone.addEventListener('dragleave', () => zone.classList.remove('drag'))
  zone.addEventListener('drop', (ev) => {
    ev.preventDefault()
    zone.classList.remove('drag')
    const f = ev.dataTransfer.files && ev.dataTransfer.files[0]
    if (f) load(f)
  })
}

/* ---------- 背景音乐（音频 blob 存 IndexedDB，循环播放） ---------- */
let bgmAudio = null
let bgmUrl = null
function setBgmVolume(v) {
  state.bgmVol = Math.min(1, Math.max(0, v))
  localStorage.setItem('stardew.bgmVol', String(state.bgmVol))
  if (bgmAudio) bgmAudio.volume = state.bgmVol
}
function setBgmOn(on) {
  state.bgmOn = on
  localStorage.setItem('stardew.bgmOn', on ? '1' : '0')
  if (bgmAudio) { if (on) bgmAudio.play().catch(() => { }); else bgmAudio.pause() }
  const label = on ? '音乐:开' : '音乐:关'
  const top = $('#btn-bgm'); if (top) top.textContent = label
  const inSet = $('#set-bgm-toggle'); if (inSet) inSet.textContent = on ? '暂停音乐' : '播放音乐'
}
async function applyBgm() {
  let blob = null
  try { blob = await wpDbGet('bgm') } catch { /* IndexedDB 不可用时保持无音乐 */ }
  if (bgmUrl) { URL.revokeObjectURL(bgmUrl); bgmUrl = null }
  if (bgmAudio) { bgmAudio.pause(); bgmAudio = null }
  if (!blob) return
  bgmUrl = URL.createObjectURL(blob)
  bgmAudio = new Audio(bgmUrl)
  bgmAudio.loop = true
  bgmAudio.volume = state.bgmVol
  if (state.bgmOn) bgmAudio.play().catch(() => { /* 自动播放策略拦截，等待首次交互重试 */ })
}
function loadBgmFile(file) {
  const isAudio = file.type.startsWith('audio/') || /\.(mp3|wav|ogg|flac|m4a|aac|opus)$/i.test(file.name)
  if (!isAudio) { toast('请选择音频文件', 'err'); return }
  if (file.size > 64 * 1024 * 1024) { toast('音频超过 64MB，无法使用', 'err'); return }
  wpDbPut(file, 'bgm')
    .then(() => applyBgm())
    .then(() => { setBgmOn(true); toast('背景音乐已更换', 'ok') })
    .catch(e => toast('音频保存失败: ' + (e && e.message ? e.message : e), 'err'))
}
// 浏览器自动播放策略：页面加载后需一次交互才允许出声；开着重试，直到成功。
document.addEventListener('pointerdown', () => {
  if (state.bgmOn && bgmAudio && bgmAudio.paused) bgmAudio.play().catch(() => { })
})

const SC_EMBED = 'https://w.soundcloud.com/player/?url=' + encodeURIComponent('https://soundcloud.com/concernedape/spring-the-valley-comes-alive') + '&auto_play=true&hide_related=true&show_comments=false&show_reposts=false&visual=false'
function toggleScPlayer() {
  let el = $('#sc-player')
  if (!el) {
    el = document.createElement('div')
    el.id = 'sc-player'
    el.innerHTML = '<div id="sc-head"><span class="sc-title">♪ 示例音乐</span>'
      + '<button class="pixel-btn btn-sm" id="sc-min" title="最小化">_</button>'
      + '<button class="pixel-btn btn-sm" id="sc-close" title="关闭">×</button></div>'
      + '<iframe id="sc-frame" title="SoundCloud 示例音乐" allow="autoplay"></iframe>'
    document.body.appendChild(el)
    $('#sc-close').addEventListener('click', () => toggleScPlayer())
    $('#sc-min').addEventListener('click', () => el.classList.toggle('sc-min'))
    // 标题栏拖动：pointer + mouse 双通道（部分内嵌 webview 只发 mouse 事件），限制在视口内
    const dragStart = (e) => {
      if (e.target.closest('button')) return
      const rect = el.getBoundingClientRect()
      const dx = e.clientX - rect.left, dy = e.clientY - rect.top
      el.style.left = rect.left + 'px'
      el.style.top = rect.top + 'px'
      el.style.bottom = 'auto'
      const move = (ev) => {
        const w = el.offsetWidth, h = el.offsetHeight
        el.style.left = Math.min(Math.max(0, ev.clientX - dx), window.innerWidth - w) + 'px'
        el.style.top = Math.min(Math.max(0, ev.clientY - dy), window.innerHeight - h) + 'px'
      }
      const up = () => {
        window.removeEventListener('pointermove', move)
        window.removeEventListener('pointerup', up)
        window.removeEventListener('mousemove', move)
        window.removeEventListener('mouseup', up)
      }
      window.addEventListener('pointermove', move)
      window.addEventListener('pointerup', up)
      window.addEventListener('mousemove', move)
      window.addEventListener('mouseup', up)
    }
    $('#sc-head').addEventListener('pointerdown', dragStart)
    $('#sc-head').addEventListener('mousedown', dragStart)
  }
  if (el.classList.contains('sc-on')) {
    el.classList.remove('sc-on')
    $('#sc-frame').src = 'about:blank'
    toast('已收起示例音乐', 'ok')
    return
  }
  $('#sc-frame').src = SC_EMBED
  el.classList.add('sc-on')
  // 对话界面里默认收成最小条，避免挡住输入框；标题界面里展开
  el.classList.toggle('sc-min', !$('#screen-main').hidden)
  toast('示例音乐加载中（需要能访问 SoundCloud）', 'ok')
}

/** 从 IndexedDB 读取头像并应用到对话区；无自定义头像时恢复默认像素画。 */
async function applyNpcAvatar() {
  let blob = null
  try { blob = await wpDbGet('avatar') } catch { /* IndexedDB 不可用时保持默认头像 */ }
  if (npcAvatarUrl) { URL.revokeObjectURL(npcAvatarUrl); npcAvatarUrl = null }
  const img = $('#npc-avatar')
  if (!img) return
  if (blob) {
    npcAvatarUrl = URL.createObjectURL(blob)
    img.src = npcAvatarUrl
    img.classList.add('custom')
  } else {
    img.src = '/junimo.png'
    img.classList.remove('custom')
  }
}
function loadNpcAvatarFile(file) {
  if (!file.type.startsWith('image/')) { toast('请选择图片文件', 'err'); return }
  if (file.size > 16 * 1024 * 1024) { toast('图片超过 16MB，无法使用', 'err'); return }
  wpDbPut(file, 'avatar')
    .then(() => applyNpcAvatar())
    .then(() => {
      toast('伙伴头像已更换', 'ok')
      // 通知打开中的人物桌宠弹窗同步预览
      window.dispatchEvent(new CustomEvent('dsh:npc-avatar-changed'))
    })
    .catch(e => toast('头像保存失败: ' + (e && e.message ? e.message : e), 'err'))
}
/**
 * 应用性格设定到人物桌宠数据：存 state 与 localStorage，并把前 120 字挂到
 * 头像的 title 上（悬停头像可速览）。空串即清除性格。
 * @param {string} persona - 规范化后的性格全文。
 */
function applyNpcPersona(persona) {

  localStorage.setItem('stardew.npcPersona', state.npcPersona)
  const img = $('#npc-avatar')

/**
 * 校验并读取 .md 文件为性格文本。校验：扩展名 .md/.markdown（或 MIME
 * text/markdown）、非空、≤512KB；读取经 FileReader，onProgress(pct) 驱动
 * 进度条（传 null 隐藏）；内容做去 BOM、统一换行、去首尾空白、64K 字符
 * 截断处理后入库，onDone(text) 回调回填编辑区。
 * @param {File} file - 用户选择或拖入的文件。
 * @param {(pct:number|null)=>void} [onProgress] - 进度回调。
 * @param {(text:string)=>void} [onDone] - 成功回调（返回处理后的文本）。
 */
function loadPersonaMdFile(file, onProgress, onDone) {
  const fname = (file.name || '').toLowerCase()
  const isMd = /\.md$/.test(fname) || /\.markdown$/.test(fname) || file.type === 'text/markdown'
  if (!isMd) {
    if (onProgress) onProgress(null)
    toast('仅支持 .md / .markdown 文件', 'err')
    return
  }
  if (file.size === 0) {
    if (onProgress) onProgress(null)
    toast('文件是空的', 'err')
    return
  }
  if (file.size > 512 * 1024) {
    if (onProgress) onProgress(null)
    toast('文件超过 512KB，无法导入', 'err')
    return
  }
  const reader = new FileReader()
  reader.onprogress = (ev) => {
    if (ev.lengthComputable && onProgress) onProgress(Math.round((ev.loaded / ev.total) * 100))
  }
  reader.onerror = () => {
    if (onProgress) onProgress(null)
    toast('读取文件失败: ' + (reader.error && reader.error.message ? reader.error.message : '未知错误'), 'err')
  }
  reader.onload = () => {
    if (onProgress) onProgress(100)
    let text = String(reader.result || '')
    if (text.charCodeAt(0) === 0xFEFF) text = text.slice(1) // 去 BOM
    text = text.replace(/\r\n?/g, '\n').trim()             // 统一换行、去首尾空白
    if (!text) {
      if (onProgress) onProgress(null)
      toast('文件内容为空', 'err')
      return
    }
    const MAX_CHARS = 64 * 1024
    if (text.length > MAX_CHARS) {
      text = text.slice(0, MAX_CHARS)
      toast('内容超过 64K 字符，已截断保存', 'err')
    }
    applyNpcPersona(text)
    if (onDone) onDone(text)
    toast('性格设定已导入', 'ok')
  }
  reader.readAsText(file)
}

// 按 PETS 清单注入桌宠层：插在 modal-root 之前保持层级（弹窗 100 > 桌宠 90）
// iframe 懒加载：仅启用的桌宠挂载 iframe，禁用的零加载；缺失文件被 SPA 回退成主页面时守卫移除，防无限递归
PETS.forEach(p => {
  const layer = document.createElement('div')
  layer.id = 'pet-layer-' + p.id
  layer.className = 'pet-layer'
  layer.setAttribute('aria-hidden', 'true')
  document.body.insertBefore(layer, $('#modal-root'))

/** 挂载指定桌宠的 iframe（启用时调用）。若页面文件缺失被服务器回退成主页面（title 相同），移除 iframe 防递归。 */
function mountPetFrame(p) {
  const layer = $('#pet-layer-' + p.id)
  if (!layer || $('#pet-frame-' + p.id)) return
  const f = document.createElement('iframe')
  f.id = 'pet-frame-' + p.id
  f.src = p.page
  f.title = '桌宠：' + p.name
  f.tabIndex = -1
  // 透明画布：无 allowtransparency 时 Chromium 给 iframe 垫白底；color-scheme:normal 防止深色方案下默认画布变暗
  f.setAttribute('allowtransparency', 'true')
  f.style.background = 'transparent'
  f.style.colorScheme = 'normal'
  f.addEventListener('load', () => {
    try {
      const doc = f.contentDocument
      // 同源守卫：桌宠页 title 是「XX - 桌宠」格式；等于主页面 title 说明服务器把缺失文件回退成了完整页面（SPA 语义），留着会 1→N 无限递归撑爆内存
      if (doc && doc.title === document.title) {
        console.warn('桌宠页面缺失（' + p.page + ' 被服务器回退为主页面），已停用该桌宠 iframe')
        f.remove()
      }
    } catch { /* 跨源（异常场景）忽略 */ }
  })
  layer.appendChild(f)
}
/** 向指定桌宠 iframe 发送命令（pause/resume 控制其动画循环）。 */
function petPost(id, msg) {

}
/**
 * 切换单只桌宠显示：pet-on 类驱动 CSS 过渡（opacity+visibility 各 0.5s），
 * 偏好按桌宠 id 存 localStorage（刷新保持），并向其 iframe 同步 pause/resume。
 * @param {string} id - 桌宠 id（PETS 成员）。
 * @param {boolean} on - 目标显示状态。
 */
function setPetVisible(id, on) {
  state.pets[id] = !!on
  localStorage.setItem('stardew.pet.' + id, state.pets[id] ? '1' : '0')
  const layer = $('#pet-layer-' + id)
  if (layer) layer.classList.toggle('pet-on', state.pets[id])
  // 懒加载：首次启用（或守卫移除后重新启用）时挂载 iframe；页面缺失导致的移除会随再次开关重试
  if (state.pets[id]) mountPetFrame(PETS.find(p => p.id === id))
  petPost(id, { type: 'dsh:pet', command: state.pets[id] ? 'resume' : 'pause' })
  syncPetsBtn()
}

function syncPetsBtn() {

/** 一键全开/全关桌宠（全关是「别挡视线」场景的一键逃生门）。 */
function toggleAllPets() {

// iframe 通信：按 contentWindow 识别来源桌宠，加载完成（dsh:pet-ready）后下发当前状态完成同步；ack 仅确认送达
window.addEventListener('message', (ev) => {
  const d = ev.data
  if (!d || typeof d !== 'object' || d.type !== 'dsh:pet-ready') return
  for (const p of PETS) {
    const f = $('#pet-frame-' + p.id)
    if (f && f.contentWindow === ev.source) {
      petPost(p.id, { type: 'dsh:pet', command: state.pets[p.id] ? 'resume' : 'pause' })
      return
    }
  }
})
/** 构建桌宠开关组（每只桌宠一行：像素滑轨开关 + 名称 + 开/关状态），用于「人物桌宠」弹窗；状态走 state.pets/setPetVisible。 */
function buildPetRows() {
  return PETS.map(p => {
    const row = document.createElement('div')
    row.className = 'pet-row'
    const toggle = document.createElement('div')
    toggle.className = 'pet-toggle' + (state.pets[p.id] ? ' on' : '')
    toggle.setAttribute('role', 'switch')
    toggle.setAttribute('aria-checked', String(state.pets[p.id]))
    toggle.tabIndex = 0
    const track = document.createElement('div')
    track.className = 'pet-toggle-track'
    const knob = document.createElement('div')
    knob.className = 'pet-toggle-knob'
    track.appendChild(knob)
    toggle.appendChild(track)
    const label = document.createElement('span')
    label.textContent = p.name
    const st = document.createElement('span')
    st.className = 'pet-state'
    const sync = () => {
      toggle.classList.toggle('on', state.pets[p.id])
      toggle.setAttribute('aria-checked', String(state.pets[p.id]))
      st.textContent = state.pets[p.id] ? '（开）' : '（关）'
    }
    sync()
    const flip = () => { setPetVisible(p.id, !state.pets[p.id]); sync() }
    toggle.addEventListener('click', flip)
    toggle.addEventListener('keydown', (ev) => {
      if (ev.key === 'Enter' || ev.key === ' ') { ev.preventDefault(); flip() }
    })
    row.appendChild(toggle); row.appendChild(label); row.appendChild(st)
    return row
  })
}

/** 从 preset 的 cordis.yml 内容解析 dsh 插件行：去重计数，disabled 标灰。 */
function parsePresetPlugins(content) {
  const seen = new Map()
  let cur = null
  for (const line of content.split('\n')) {
    const nm = line.match(/^\s*name: '([@\w][\w@/.:-]*)'/)
    if (nm) {
      cur = nm[1]
      const row = seen.get(cur)
      if (row) row.count++
      else seen.set(cur, { name: cur, off: false, count: 1 })
      continue
    }
    const dis = line.match(/^\s*disabled:\s*(.*)$/)
    if (dis && cur && seen.has(cur)) {
      // disabled 总是写在 name 之后、同一 id 块内；!!js 为平台条件，运行时决定。
      if (dis[1].trim() === 'true') seen.get(cur).off = true
    }
  }
  return Array.from(seen.values()).filter(r => r.name.startsWith('@deepseek-ai/'))
}

        if (btn) btn.textContent = raw.hidden ? '查看原始文件' : '隐藏原始文件'
      },
    },
  ])
}

/* ---------- 模型选择 ---------- */
async function openModelPicker() {
  if (!state.sessionId) return
  let v
  try { v = await rpc('session/modelCatalog', {}) }
  catch (e) { toast('读取模型失败: ' + e.message, 'err'); return }
  // rc.1 目录里 default 是「未配置会话用的默认选择」，即当前生效模型
  v.current = v.default
  const body = document.createElement('div')
  if (v.failures && v.failures.length > 0) {
    for (const f of v.failures) {
      const el = document.createElement('div')
      el.style.fontSize = '12px'
      el.style.color = '#ff6a6a'
      el.textContent = '提供方 ' + f.name + ' 加载失败：' + f.message
      body.appendChild(el)
    }
  }
  const pick = (provider, model, effort) => {
    rpc('session/selectModel', { request: { sessionId: state.sessionId, provider, model, ...(effort ? { reasoningEffort: effort } : {}) } })
      .then(sel => {
        applyModel(sel.selected)
        toast('已切换到 ' + sel.selected.model, 'ok')
        closeModal()
      })
      .catch(e => toast('切换失败: ' + e.message, 'err'))
  }
  for (const g of v.groups || []) {
    const gl = document.createElement('div')
    gl.className = 'group-label'
    gl.textContent = g.name
    body.appendChild(gl)
    for (const m of g.models || []) {
      const row = document.createElement('div')
      row.className = 'list-row' + (v.current && v.current.provider === g.id && v.current.model === m.id ? ' r-active' : '')
      const main = document.createElement('div')
      main.className = 'r-main'
      const nm = document.createElement('div')
      nm.className = 'r-name'
      nm.textContent = m.name || m.id
      const mt = document.createElement('div')
      mt.className = 'r-meta'
      mt.textContent = m.id + (m.description ? ' · ' + m.description : '')
      main.appendChild(nm); main.appendChild(mt)
      row.appendChild(main)
      row.addEventListener('click', () => pick(g.id, m.id, m.reasoning ? (m.reasoning.defaultEffort || (m.reasoning.efforts[0] && m.reasoning.efforts[0].id)) : undefined))
      body.appendChild(row)
      if (m.reasoning && m.reasoning.efforts && m.reasoning.efforts.length > 1) {
        for (const ef of m.reasoning.efforts) {
          const sub = document.createElement('div')
          sub.className = 'list-row r-sub' + (v.current && v.current.provider === g.id && v.current.model === m.id && v.current.reasoningEffort === ef.id ? ' r-active' : '')
          const sm = document.createElement('div')
          sm.className = 'r-main'
          const sn = document.createElement('div')
          sn.className = 'r-name'
          sn.textContent = '思考强度：' + ef.name
          sm.appendChild(sn)
          sub.appendChild(sm)
          sub.addEventListener('click', (ev) => { ev.stopPropagation(); pick(g.id, m.id, ef.id) })
          body.appendChild(sub)
        }
      }
    }
  }
  if (body.children.length === 0) {
    const el = document.createElement('div')
    el.textContent = '没有可用模型。请先在设置中配置 API 密钥，或添加自定义提供方。'
    body.appendChild(el)
  }
  // 已占用路由：session/modelCatalog 分组 + llm/listProviders 目录（休眠路由也计入，防止遮蔽既有提供方）
  const takenRoutes = new Set((v.groups || []).map(g => g.id))
  try {
    const lp = await rpc('llm/listProviders', {})
    for (const p of lp || []) takenRoutes.add(p.id)
  } catch { /* 目录不可用时按已知分组判断，不阻塞入口 */ }
  const addRow = document.createElement('div')
  addRow.className = 'list-row'
  const addMain = document.createElement('div')
  addMain.className = 'r-main'
  const addName = document.createElement('div')
  addName.className = 'r-name'
  addName.textContent = '＋ 添加自定义提供方…'
  const addMeta = document.createElement('div')
  addMeta.className = 'r-meta'
  addMeta.textContent = 'OpenAI / Anthropic 兼容网关：填接口地址与密钥即可加入模型列表'
  addMain.appendChild(addName); addMain.appendChild(addMeta)
  addRow.appendChild(addMain)
  addRow.addEventListener('click', () => openCustomProviderForm([...takenRoutes]))
  body.appendChild(addRow)
  openModal('模型选择', body, [{ label: '关闭', onClick: () => { } }])
}

/* ---------- 自定义模型提供方 ---------- */
/** 自定义提供方写入的设置命名空间（pi-ai 适配器：OpenAI/Anthropic 兼容网关，保存即生效）。 */
const CUSTOM_PROVIDER_NS = 'llm-pi-ai'
/** pi-ai 适配器接受的线路协议；默认 openai-completions（绝大多数兼容网关）。 */
const CUSTOM_PROVIDER_PROTOCOLS = ['openai-completions', 'openai-responses', 'anthropic-messages']
/** 提供方路由 id 约束：小写字母开头的小写字母/数字/连字符（凭证引用是 POSIX 标识符，不能以数字开头）。 */
const ROUTE_ID_RE = /^[a-z][a-z0-9]*(?:-[a-z0-9]+)*$/
/** 由路由 id 派生凭证引用名（与官方 UI 同规则：大写、非字母数字段转下划线、_API_KEY 结尾）。 */
function deriveKeyRef(route) {
  return route.toUpperCase().replace(/[^A-Z0-9]+/g, '_') + '_API_KEY'
}
/**
 * 打开「添加自定义提供方」表单：路由 id、显示名、接口地址、协议、密钥（可空）、模型列表。
 * 保存 = settings.mutate 写 llm-pi-ai 命名空间的 providers.<route>（pi-ai 即时注册路由），
 * 密钥另经 credentials.set 存宿主机；成功后重开模型选择，新提供方已入列。
 * @param {string[]} taken - 已占用的路由 id（含休眠路由），新 id 不得遮蔽。
 */
function openCustomProviderForm(taken) {
  const body = document.createElement('div')
  const hint = document.createElement('div')
  hint.style.cssText = 'font-size:12px;color:var(--stone)'
  hint.textContent = '添加 OpenAI / Anthropic 兼容网关（如 one-api、new-api、vLLM、OpenRouter）。保存后立即出现在模型列表，无需重启。'
  body.appendChild(hint)
  /** 表单字段行：火把橙标签 + 控件 + 可选灰字说明。 */
  const fieldRow = (labelText, control, note) => {
    const row = document.createElement('div')
    row.style.cssText = 'display:flex;flex-direction:column;gap:3px;margin-top:9px'
    const label = document.createElement('div')
    label.style.cssText = 'font-size:12px;color:var(--torch);text-shadow:1px 1px 0 var(--black);letter-spacing:1px'
    label.textContent = labelText
    row.appendChild(label)
    row.appendChild(control)
    if (note) {
      const n = document.createElement('div')
      n.style.cssText = 'font-size:11px;color:var(--stone)'
      n.textContent = note
      row.appendChild(n)
    }
    body.appendChild(row)
    return row
  }
  const mkInput = (type, placeholder) => {
    const el = document.createElement('input')
    el.className = 'pixel-input'
    el.type = type
    el.placeholder = placeholder
    el.style.cssText = 'width:100%;box-sizing:border-box'
    return el
  }
  const routeInput = mkInput('text', 'my-gateway')
  fieldRow('提供方 ID', routeInput, '小写字母开头，仅小写字母/数字/连字符；用作模型分组标识与密钥名')
  const nameInput = mkInput('text', '')
  fieldRow('显示名称（可选）', nameInput, '留空则显示提供方 ID')
  const urlInput = mkInput('text', 'https://gateway.example/v1')
  fieldRow('接口地址（baseURL）', urlInput)
  const protoSelect = document.createElement('select')
  protoSelect.className = 'pixel-input'
  protoSelect.style.cssText = 'width:100%;box-sizing:border-box'
  for (const p of CUSTOM_PROVIDER_PROTOCOLS) {
    const opt = document.createElement('option')
    opt.value = p
    opt.textContent = p
    protoSelect.appendChild(opt)
  }
  fieldRow('接口协议', protoSelect, '绝大多数兼容网关选 openai-completions')
  const keyInput = mkInput('password', '')
  fieldRow('API 密钥（可选）', keyInput, '留空则走网关自身鉴权；填写则加密存宿主机凭证库')
  // 模型列表 + 「获取模型列表」：llm.discoverModels 只探测草稿配置，不写任何东西
  const modelsTa = document.createElement('textarea')
  modelsTa.className = 'pixel-input'
  modelsTa.rows = 3
  modelsTa.placeholder = '每行一个模型 id，如：\ndeepseek-chat\ngpt-4o-mini'
  modelsTa.style.cssText = 'width:100%;box-sizing:border-box;resize:vertical;font-family:inherit'
  const fetchBtn = document.createElement('button')
  fetchBtn.className = 'pixel-btn btn-sm'
  fetchBtn.type = 'button'
  fetchBtn.style.marginLeft = '8px'
  fetchBtn.textContent = '获取模型列表'
  let discovered = new Map()
  fetchBtn.addEventListener('click', async () => {
    const baseURL = urlInput.value.trim()
    if (!baseURL) { toast('请先填写接口地址', 'err'); return }
    fetchBtn.disabled = true
    fetchBtn.textContent = '获取中…'
    try {
      const v = await rpc('llm/discoverModels', {
        settingsNs: CUSTOM_PROVIDER_NS,
        request: {
          baseURL,
          api: protoSelect.value,
          ...(keyInput.value.trim() ? { apiKey: keyInput.value.trim() } : {}),
        },
      })
      const models = Array.isArray(v) ? v : (v.models || [])
      if (models.length === 0) { toast('该地址未返回任何模型，请检查地址/协议/密钥', 'err') }
      else {
        discovered = new Map(models.map(m => [m.id, m]))
        modelsTa.value = models.map(m => m.id).join('\n')
        toast('发现 ' + models.length + ' 个模型', 'ok')
      }
    } catch (e) { toast('获取失败: ' + e.message, 'err') }
    finally { fetchBtn.disabled = false; fetchBtn.textContent = '获取模型列表' }
  })
  const modelsRow = document.createElement('div')
  modelsRow.style.cssText = 'display:flex;flex-direction:column;gap:3px;margin-top:9px'
  const modelsLabelRow = document.createElement('div')
  modelsLabelRow.style.cssText = 'display:flex;align-items:center'
  const modelsLabel = document.createElement('div')
  modelsLabel.style.cssText = 'font-size:12px;color:var(--torch);text-shadow:1px 1px 0 var(--black);letter-spacing:1px'
  modelsLabel.textContent = '模型列表'
  modelsLabelRow.appendChild(modelsLabel); modelsLabelRow.appendChild(fetchBtn)
  modelsRow.appendChild(modelsLabelRow); modelsRow.appendChild(modelsTa)
  const modelsNote = document.createElement('div')
  modelsNote.style.cssText = 'font-size:11px;color:var(--stone)'
  modelsNote.textContent = '至少一个；可手填，或填好地址/协议/密钥后点「获取模型列表」自动拉取'
  modelsRow.appendChild(modelsNote)
  body.appendChild(modelsRow)
  /** 提交：校验 → settings.mutate 写 profile →（可选）credentials.set 存密钥 → 重开模型选择。 */
  const submit = async () => {
    const route = routeInput.value.trim()
    const displayName = nameInput.value.trim()
    const baseURL = urlInput.value.trim()
    const key = keyInput.value.trim()
    const modelIds = modelsTa.value.split('\n').map(s => s.trim()).filter(Boolean)
    if (!ROUTE_ID_RE.test(route)) { toast('提供方 ID 需以小写字母开头，仅含小写字母/数字/连字符', 'err'); return }
    if (taken.includes(route)) { toast('提供方 ID 已存在：' + route, 'err'); return }
    if (!/^https?:\/\//.test(baseURL)) { toast('接口地址需以 http:// 或 https:// 开头', 'err'); return }
    if (modelIds.length === 0) { toast('请至少填写一个模型 id', 'err'); return }
    createBtn.disabled = true
    try {
      const keyRef = deriveKeyRef(route)
      const profile = {
        ...(displayName ? { displayName } : {}),
        ...(key ? { apiKeyEnv: keyRef } : {}),
        api: protoSelect.value,
        baseURL,
        models: modelIds.map(id => {
          const d = discovered.get(id) || {}
          return { id, ...(d.name ? { name: d.name } : {}), ...(d.contextWindow ? { contextWindow: d.contextWindow } : {}), ...(d.maxTokens ? { maxTokens: d.maxTokens } : {}) }
        }),
      }
      // 不带 expectedRevision：写入仍经 schema 校验（非法协议/模型当场被拒），且密钥保存失败后重试不会被版本冲突卡死
      await rpc('settings/mutate', { ns: CUSTOM_PROVIDER_NS, ops: [{ op: 'set', path: ['providers', route], value: profile }] })
      if (key) await rpc('credentials/set', { ref: keyRef, value: key })
      toast('已添加提供方 ' + route + (key ? '（密钥已保存）' : ''), 'ok')
      openModelPicker()
    } catch (e) {
      toast('添加失败: ' + e.message, 'err')
      createBtn.disabled = false
    }
  }
  const createBtn = document.createElement('button')
  createBtn.className = 'pixel-btn btn-sm btn-gold'
  createBtn.type = 'button'
  createBtn.textContent = '创建提供方'
  createBtn.addEventListener('click', submit)
